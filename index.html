<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <p>KRA TAX CALCULATOR</p>
    </div>
    <div>
        <form id="tax_form">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Basic Salary</label>
            
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Benefits</label>
                <input type="number" class="form-control" id="benefits">
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>


    <div>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Tax Category</th>
                    <th scope="col">Category Output</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Gross Salary</td>
                    <td id="gross"></td>
                </tr>
                <tr>
                    <td>NHIF</td>
                    <td id="nhif"></td>
                </tr>
                <tr>
                    <td>NSSF</td>
                    <td id="nssf"></td>
                </tr>
                <tr>
                    <td>NHDF</td>
                    <td id="nhdf"></td>
                </tr>
                <tr>
                    <td>Taxable_income</td>
                    <td id="taxable_income"></td>
                </tr>
                <tr>
                    <td>PAYEE</td>
                    <td id="PAYEE"></td>
                </tr>
                <tr>
                    <td>Net_salary</td>
                    <td id="net_salary"></td>
                </tr>

            </tbody>
        </table>

    </div>

    <script src="tax.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
